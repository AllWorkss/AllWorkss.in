<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title if page else 'Allworkss — 360° AI Business Intelligence & Digital Agency' }}</title>
  <meta name="title" content="{{ page.title if page else 'Allworkss Digital Solutions' }}">
  <meta name="description" content="{{ page.description if page else 'Enterprise Digital Solutions, High-Performance Web Architecture, Meta Ads, and Local SEO.' }}">
  <meta name="keywords" content="Business Intelligence India, Local SEO Mumbai, Web Development Thane, Meta Ads Agency, Cloud Run GCP, Yasar Intakhab Khan">
  <meta name="author" content="Yasar Intakhab Khan">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <link rel="canonical" href="{{ page.canonical if page else 'https://allworkss.in/' }}">

  <!-- Geo Targeting: Thane / Mumbai / Maharashtra / India -->
  <meta name="geo.region" content="IN-MH">
  <meta name="geo.placename" content="Thane, Mumbai Metropolitan Region">
  <meta name="geo.position" content="19.2183;72.9781">
  <meta name="ICBM" content="19.2183, 72.9781">

  <!-- OpenGraph / Social Rich Previews -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.canonical if page else 'https://allworkss.in/' }}">
  <meta property="og:title" content="{{ page.title if page else 'Allworkss Digital Solutions' }}">
  <meta property="og:description" content="{{ page.description if page else 'Enterprise Digital Solutions' }}">
  <meta property="og:image" content="https://allworkss.in/static/images/og-allworkss-preview.webp">
  <meta property="og:site_name" content="Allworkss Digital Solutions">
  <meta property="og:locale" content="en_IN">

  <!-- Twitter Card Data -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="{{ page.canonical if page else 'https://allworkss.in/' }}">
  <meta name="twitter:title" content="{{ page.title if page else 'Allworkss Digital Solutions' }}">
  <meta name="twitter:description" content="{{ page.description if page else 'Enterprise Digital Solutions' }}">
  <meta name="twitter:image" content="https://allworkss.in/static/images/og-allworkss-preview.webp">

  <!-- JSON-LD Multi-Entity Schema Graph -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Person",
        "@id": "https://allworkss.in/#founder",
        "name": "Yasar Intakhab Khan",
        "jobTitle": "Founder & Chief Technology Officer",
        "worksFor": {
          "@type": "Organization",
          "name": "Allworkss Consultancy & Digital Solutions",
          "url": "https://allworkss.in"
        },
        "url": "https://allworkss.in/about-founder",
        "sameAs": [
          "https://github.com/AllWorkss",
          "https://allworkss.in",
          "https://allworkss.space"
        ],
        "knowsAbout": [
          "FastAPI & High-Concurrency Python Backends",
          "GST & MCA Financial Compliance Auditing",
          "Enterprise Technical SEO & Programmatic Search",
          "Serverless Cloud Infrastructure (GCP, Docker)",
          "Meta Ads Conversions API (CAPI) Architecture"
        ]
      },
      {
        "@type": "LocalBusiness",
        "@id": "https://allworkss.in/#localbusiness",
        "name": "Allworkss Consultancy & Digital Solutions",
        "url": "https://allworkss.in",
        "telephone": "+91-9967376681",
        "priceRange": "₹₹",
        "founder": {
          "@id": "https://allworkss.in/#founder"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Thane",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "areaServed": [
          "Thane",
          "Mumbai Metropolitan Region",
          "Maharashtra",
          "India"
        ]
      },
      {
        "@type": "Service",
        "@id": "{{ page.canonical if page else 'https://allworkss.in/' }}#service",
        "name": "{{ page.h1 if page else 'Allworkss Enterprise Services' }}",
        "serviceType": "{{ page.service_type if page else 'Consultancy & Technology' }}",
        "provider": {
          "@id": "https://allworkss.in/#localbusiness"
        },
        "description": "{{ page.description if page else 'Digital Solutions' }}",
        "url": "{{ page.canonical if page else 'https://allworkss.in/' }}"
      },
      {
        "@type": "BreadcrumbList",
        "@id": "{{ page.canonical if page else 'https://allworkss.in/' }}#breadcrumb",
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": "https://allworkss.in/"
          },
          {
            "@type": "ListItem",
            "position": 2,
            "name": "Services",
            "item": "https://allworkss.in/#services"
          },
          {
            "@type": "ListItem",
            "position": 3,
            "name": "{{ page.h1 if page else 'Service' }}",
            "item": "{{ page.canonical if page else 'https://allworkss.in/' }}"
          }
        ]
      }
    ]
  }
  </script>

  <!-- Typography, Tailwind & Alpine -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="h-full flex flex-col antialiased bg-slate-950 text-white">
  {% block content %}{% endblock %}
</body>
</html>
